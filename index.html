<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Åsa Wind</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --bg:#f6f7f9; --fg:#14181f; --mute:#667085; --card:#fff; --line:#e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --fg:#e8ebf0; --mute:#8b94a3; --card:#171b22; --line:#262c36; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--mute); font-size:13px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; }
  .row { display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  label { font-size:13px; color:var(--mute); display:inline-flex; align-items:center; gap:6px; }
  select, button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-height:40px; font:inherit; font-size:16px; cursor:pointer; }
  button.on { border-color:var(--fg); font-weight:600; }
  .seg { display:inline-flex; gap:6px; }
  .legend { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .chip { display:inline-flex; align-items:center; gap:8px; font-size:14px; padding:8px 14px; border-radius:999px; }
  .chip i { width:16px; height:4px; border-radius:2px; display:inline-block; background:var(--c); }
  .chip.off { opacity:.5; }
  .chip.off i { background:var(--mute); }
  .chip.off span { text-decoration:line-through; }
  svg { width:100%; height:auto; display:block; touch-action:pan-y; }
  .readout { min-height:86px; margin-bottom:4px; }
  .readout .when { font-weight:600; margin-bottom:4px; }
  .readout .when span { color:var(--mute); font-weight:400; }
  .readout .items { display:flex; flex-wrap:wrap; gap:4px 16px; }
  .readout .it { display:inline-flex; align-items:baseline; gap:6px; font-size:14px; font-variant-numeric:tabular-nums; }
  .readout .it i { width:10px; height:10px; border-radius:50%; background:var(--c); display:inline-block; align-self:center; }
  .readout .it b { font-size:17px; }
  .readout .it small { color:var(--mute); font-size:12px; }
  details.loc { margin-bottom:8px; }
  details.loc summary { cursor:pointer; color:var(--mute); font-size:14px; min-height:36px; display:flex; align-items:center; }
  .locform { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  input[type=text] { flex:1 1 200px; min-width:0; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-height:40px; font:inherit; font-size:16px; }
  .msg { font-size:12px; color:var(--mute); margin-top:6px; }
  [hidden] { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .topbar .seg button { min-width:56px; }
  .mapwrap { position:relative; height:min(66vh, 600px); min-height:340px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#1a1d24; }
  #map { position:absolute; inset:0; }
  .mapwrap canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:450; transition:opacity .15s; }
  .timebox { display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; margin-top:8px; }
  .timecol { min-width:0; }
  #mapPlay { min-width:48px; min-height:36px; }
  input[type=range] { -webkit-appearance:none; appearance:none; background:transparent; width:100%; height:36px; margin:0; display:block; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:var(--line); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; box-sizing:border-box; width:20px; height:20px; border-radius:50%; background:var(--fg); border:2px solid var(--card); margin-top:-7px; }
  input[type=range]::-moz-range-thumb { box-sizing:border-box; width:20px; height:20px; border-radius:50%; background:var(--fg); border:2px solid var(--card); }
  .ticks { position:relative; height:30px; margin:-6px 10px 0; }
  .ticks i { position:absolute; top:0; width:1px; height:6px; background:var(--mute); opacity:.55; }
  .ticks i.day { height:12px; opacity:1; }
  .ticks span { position:absolute; top:13px; font-size:11px; color:var(--mute); transform:translateX(-50%); white-space:nowrap; }
  .ticks span.day { font-weight:700; color:var(--fg); }
  #mapGraph { width:100%; height:76px; display:block; touch-action:pan-y; }
  .graphcap { font-size:12px; color:var(--mute); margin-top:2px; min-height:16px; }
  .when2 { font-weight:600; font-size:15px; margin-top:8px; }
  .legendbar { position:relative; height:12px; border-radius:6px; margin:14px 4px 22px; }
  .legendbar span { position:absolute; top:16px; transform:translateX(-50%); font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; }
  #mapReadout { min-height:40px; margin-top:6px; font-size:15px; }
  #mapReadout button { margin-left:8px; min-height:34px; padding:4px 10px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:center; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; line-height:1.25; }
  th { color:var(--mute); font-weight:600; font-size:13px; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--card); padding-left:2px; }
  td.t b { display:block; font-size:15px; }
  td.t small { color:var(--mute); font-size:12px; }
  td .v { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  td .r { color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums; }
  td .none { color:var(--mute); }
  .arrow { display:inline-block; font-size:15px; }
  .err { color:#c0392b; font-size:13px; }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  @media (max-width: 560px) {
    main { padding:12px 8px; }
    .card { padding:10px 8px; border-radius:10px; }
    h1, .sub { padding-left:6px; }
    .chip { padding:6px 11px; font-size:13px; }
    .readout .items { gap:2px 12px; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Åsa coast wind</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="topbar">
    <span class="seg"><button id="tabF" class="on">Forecast</button><button id="tabM">Map</button></span>
    <span class="seg"><button id="bKn">kn</button><button id="bMs" class="on">m/s</button></span>
  </div>

  <div id="viewForecast">
  <div class="card">
    <div class="row">
      <label>Horizon
        <select id="selHorizon">
          <option value="24">24 h</option>
          <option value="48">48 h</option>
          <option value="72">3 days</option>
          <option value="120">5 days</option>
          <option value="168">7 days</option>
          <option value="240">10 days</option>
        </select>
      </label>
      <label>Table step
        <select id="selStep">
          <option value="1">1 h</option>
          <option value="3">3 h</option>
          <option value="6">6 h</option>
          <option value="12">12 h</option>
        </select>
      </label>
    </div>
    <details class="loc" id="loc">
      <summary id="locSummary">Location</summary>
      <div class="locform">
        <input type="text" id="locInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="lat, lon  e.g. 57.325, 12.105" aria-label="Coordinates">
        <button id="locSet">Set</button>
        <button id="locGps">My location</button>
        <button id="locReset">Åsa</button>
      </div>
      <div class="msg" id="locMsg">Tip: long-press a spot on the sea in Google Maps or Apple Maps to copy its coordinates. DMI, MET Nordic, SMHI and MET Norway cover the Nordic area only.</div>
    </details>
    <div class="legend" id="legend"></div>
    <div class="readout" id="readout" aria-live="polite"></div>
    <svg id="chart" viewBox="0 0 860 340" role="img" aria-label="Wind forecast chart"></svg>
    <div class="err" id="errs"></div>
  </div>

  <div class="card scroll">
    <table id="tbl"></table>
  </div>
  </div>

  <div id="viewMap" hidden>
    <div class="card">
      <div class="row">
        <label>Model
          <select id="mapModel">
            <option value="dmi">DMI HARMONIE 2 km</option>
            <option value="nordic">MET Nordic 1 km</option>
            <option value="ecmwf">ECMWF IFS 0.25°</option>
          </select>
        </label>
        <label>Map
          <select id="mapBase">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <button id="mapZoomIn" title="Back to your forecast location">My spot</button>
      </div>
      <details class="loc" id="keyBox">
        <summary id="keySummary">Dark map key</summary>
        <div class="locform">
          <input type="text" id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your CARTO key" aria-label="CARTO basemap key">
          <button id="keySave">Save</button>
          <button id="keyClear">Clear</button>
        </div>
        <div class="msg" id="keyMsg"></div>
      </details>
      <div class="mapwrap" id="mapwrap">
        <div id="map"></div>
        <canvas id="heat"></canvas>
        <canvas id="parts"></canvas>
      </div>
      <div class="legendbar" id="mapLegend"></div>
      <div class="when2" id="mapWhen"></div>
      <div class="timebox">
        <button id="mapPlay" aria-label="Play">▶</button>
        <div class="timecol">
          <input type="range" id="mapTime" min="0" max="0" value="0" aria-label="Forecast time">
          <div class="ticks" id="mapTicks"></div>
          <svg id="mapGraph" role="img" aria-label="Wind speed forecast for the selected spot"></svg>
        </div>
      </div>
      <div class="graphcap" id="mapGraphCap"></div>
      <div id="mapReadout">Tap anywhere on the map to read the wind there, or to get the forecast for that spot.</div>
      <div class="msg" id="mapStatus"></div>
      <div class="msg" id="mapNote"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script>
const COLORS = {
  'DMI HARMONIE 2 km': '#2a7de1',
  'MET Nordic 1 km': '#e8590c',
  'ECMWF IFS 0.25°': '#9c36b5',
  'SMHI SNOW': '#2f9e44',
  'MET Norway': '#0c8599',
};
const TZ = 'Europe/Stockholm';
const $ = (id) => document.getElementById(id);

// ---- settings (remembered in the browser) ----
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
let DATA = null;
let unit = recall('unit2', 'ms'); // 'unit2': older saved unit choices are ignored, so the default is m/s
let horizon = recall('horizon', 72);
let step = recall('step', 3);
let hidden = new Set(recall('hiddenSources', []));
const colorOf = (n) => COLORS[n] || '#888';

const conv = (v) => v == null ? null : (unit === 'kn' ? v * 1.94384 : v);
const fmt = (v) => v == null ? '–' : v.toFixed(unit === 'kn' ? 0 : 1);
const hourFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const timeFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fetchedFmt =new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit' });
const dayFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short', day: 'numeric' });
const hourOnly = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour: '2-digit', hour12: false });
const localHour = (t) => parseInt(hourOnly.format(new Date(t)), 10) % 24;

// ---- data sources: the browser calls the weather APIs directly ----
const DEFAULT_LOC = { lat: 57.322, lon: 12.142, name: 'Åsa' };
let LOC = recall('loc', DEFAULT_LOC);
if (!LOC || !Number.isFinite(LOC.lat) || !Number.isFinite(LOC.lon)) LOC = DEFAULT_LOC;
if (LOC.lat === 57.325 && LOC.lon === 12.105) LOC = DEFAULT_LOC; // the previous default point
let LAT = LOC.lat, LON = LOC.lon;
const SHORT = { 'DMI HARMONIE 2 km': 'DMI', 'MET Nordic 1 km': 'Nordic', 'ECMWF IFS 0.25°': 'ECMWF', 'SMHI SNOW': 'SMHI', 'MET Norway': 'MET NO' };
const coordText = (lat, lon) => `${Math.abs(lat).toFixed(3)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(3)}°${lon >= 0 ? 'E' : 'W'}`;
const num = (v) => (typeof v === 'number' ? v : null);
// ---- mock mode: open the page with ?mock (or ?mock=1) to use synthetic forecasts, no network needed ----
let MOCK = /[?&]mock(=1|=true|&|$)/.test(location.search);
function useMock() { MOCK = true; load(); if (MAP.ready && !$('viewMap').hidden) loadMapData(); }
function mockSeries(model, lat, lon, n = 240) {
  const t0 = Math.floor(Date.now() / 3600e3) * 3600e3, seed = (model.length * 1.7) % 3, time = [], speed = [], gust = [], dir = [], lull = [];
  for (let i = 0; i < n; i++) {
    time.push(t0 + i * 3600e3);
    const geo = Math.sin((lat * 13 + lon * 7)) * 0.8; // small spatial variation so the map field looks alive
    const front = 9 * Math.exp(-(((i - 34) / 9) ** 2)) + 12 * Math.exp(-(((i - 100) / 12) ** 2)); // two blows
    const v = Math.max(0.3, 4.5 + 2.5 * Math.sin(i / 7 + seed) + front + geo + seed * 0.4);
    speed.push(+v.toFixed(1)); gust.push(+(v * (1.3 + 0.1 * Math.sin(i / 3))).toFixed(1)); lull.push(+(v * 0.7).toFixed(1));
    dir.push(Math.round((210 + i * 1.5 + 40 * Math.sin(i / 20) + lon * 5 + seed * 10) % 360));
  }
  return { time, speed, gust, dir, lull };
}
function mockJson(url) {
  const u = new URL(url), q = u.searchParams;
  const iso = (t) => new Date(t).toISOString();
  if (u.host.includes('open-meteo')) {
    const lats = q.get('latitude').split(',').map(Number), lons = q.get('longitude').split(',').map(Number), id = q.get('models');
    const days = +q.get('forecast_days') || 7;
    const arr = lats.map((la, k) => {
      const m = mockSeries(id, la, lons[k], days * 24);
      return { hourly: { time: m.time.map((t) => iso(t).slice(0, 16)), ['wind_speed_10m_' + id]: m.speed, ['wind_gusts_10m_' + id]: m.gust, ['wind_direction_10m_' + id]: m.dir } };
    });
    return lats.length > 1 ? arr : arr[0];
  }
  const lat = +(q.get('lat') || u.pathname.match(/lat\/([\d.]+)/)?.[1] || LAT), lon = +(q.get('lon') || u.pathname.match(/lon\/([\d.]+)/)?.[1] || LON);
  if (u.host.includes('smhi')) {
    const m = mockSeries('SMHI', lat, lon, 160);
    return { timeSeries: m.time.map((t, i) => ({ time: iso(t), data: { wind_speed: m.speed[i], wind_speed_of_gust: m.gust[i], wind_from_direction: m.dir[i] } })) };
  }
  const m = mockSeries('MET Norway', lat, lon, 200);
  return { properties: { timeseries: m.time.map((t, i) => ({ time: iso(t), data: { instant: { details: { wind_speed: m.speed[i], wind_speed_of_gust: m.gust[i], wind_from_direction: m.dir[i], wind_speed_percentile_10: m.lull[i] } } } })) } };
}
async function getJson(url) {
  if (MOCK) { await new Promise((r) => setTimeout(r, 150)); return mockJson(url); }
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}
// One request per Open-Meteo model, so one bad model id cannot take down the others.
async function omModel(id, label) {
  const j = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m&models=${id}` +
    `&wind_speed_unit=ms&timezone=UTC&forecast_days=10`);
  const h = j.hourly;
  const pick = (name) => h[`${name}_${id}`] || h[name] || [];
  const speed = pick('wind_speed_10m');
  if (!speed.length || speed.every((x) => x == null)) throw new Error('no data');
  return { [label]: { time: h.time.map((t) => t + 'Z'), speed, gust: pick('wind_gusts_10m'), dir: pick('wind_direction_10m') } };
}
async function smhi() {
  const j = await getJson(`https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/` +
    `lon/${LON.toFixed(4)}/lat/${LAT.toFixed(4)}/data.json?parameters=wind_speed,wind_speed_of_gust,wind_from_direction`);
  const ts = j.timeSeries || [];
  return { 'SMHI SNOW': { time: ts.map((e) => e.time), speed: ts.map((e) => num(e.data.wind_speed)),
    gust: ts.map((e) => num(e.data.wind_speed_of_gust)), dir: ts.map((e) => num(e.data.wind_from_direction)) } };
}
async function metno() {
  const j = await getJson(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${LAT.toFixed(4)}&lon=${LON.toFixed(4)}`);
  const ts = j.properties.timeseries, d = (e) => e.data.instant.details;
  return { 'MET Norway': { time: ts.map((e) => e.time), speed: ts.map((e) => num(d(e).wind_speed)),
    gust: ts.map((e) => num(d(e).wind_speed_of_gust)), dir: ts.map((e) => num(d(e).wind_from_direction)),
    // Only MET Norway publishes a low-side wind value: the 10th percentile of its ensemble. Used as the lull.
    lull: ts.map((e) => num(d(e).wind_speed_percentile_10)) } };
}
async function buildData() {
  const jobs = [
    ['DMI HARMONIE', () => omModel('dmi_harmonie_arome_europe', 'DMI HARMONIE 2 km')],
    ['MET Nordic', () => omModel('metno_nordic', 'MET Nordic 1 km')],
    ['ECMWF IFS', () => omModel('ecmwf_ifs025', 'ECMWF IFS 0.25°')],
    ['SMHI', smhi],
    ['MET Norway', metno],
  ];
  const res = await Promise.allSettled(jobs.map(([, f]) => f()));
  const sources = {}, errors = {};
  res.forEach((r, i) => {
    if (r.status === 'fulfilled') Object.assign(sources, r.value);
    else errors[jobs[i][0]] = String((r.reason && r.reason.message) || r.reason);
  });
  return { lat: LAT, lon: LON, fetchedAt: new Date().toISOString(), sources, errors };
}

let loadId = 0;
async function load() {
  const my = ++loadId;
  let data;
  try {
    data = await buildData();
    if (!Object.keys(data.sources).length) throw new Error('no sources');
  } catch (e) {
    if (my === loadId) { $('sub').innerHTML = 'No forecast sources reachable. Check your connection and the coordinates. <button id="useMock">Use mock data</button>'; $('useMock').onclick = useMock; }
    return;
  }
  if (my !== loadId) return; // the location changed while this request was running
  DATA = data;
  $('sub').textContent = `${coordText(DATA.lat, DATA.lon)} · fetched ${fetchedFmt.format(new Date(DATA.fetchedAt))} · 10 m wind${MOCK ? ' · MOCK DATA' : ''}`;
  const errs = Object.entries(DATA.errors || {}).map(([k, v]) => `${k}: ${v}`);
  $('errs').textContent = errs.length ? 'Unavailable → ' + errs.join(' | ') : '';
  render();
}

function seriesWindow() {
  const now = Date.now();
  const out = {};
  for (const n of Object.keys(DATA.sources)) {
    const s = DATA.sources[n];
    out[n] = s.time.map((t, i) => ({
      t: new Date(t).getTime(),
      speed: conv(s.speed[i]), gust: conv(s.gust[i]), dir: s.dir[i],
      lull: s.lull ? conv(s.lull[i]) : null,
    })).filter((p) => p.t >= now - 3600e3 && p.t <= now + horizon * 3600e3);
  }
  return out;
}

// Split a series into runs where `ok(point)` holds, so gaps (a model that has ended) break the line.
function runs(pts, ok) {
  const out = []; let cur = [];
  for (const p of pts) { if (ok(p)) cur.push(p); else { if (cur.length) out.push(cur); cur = []; } }
  if (cur.length) out.push(cur);
  return out;
}

// Smooth curve through points [[x,y],...] (monotone cubic, Fritsch-Carlson): no overshoot, so a line never
// dips below a real minimum or above a real peak. Returns path commands starting with M (or L when cont).
function smoothPath(P, cont) {
  const n = P.length, f = (v) => v.toFixed(1);
  if (!n) return '';
  let d = `${cont ? 'L' : 'M'}${f(P[0][0])},${f(P[0][1])}`;
  if (n < 3) { for (let i = 1; i < n; i++) d += `L${f(P[i][0])},${f(P[i][1])}`; return d; }
  const dx = [], sl = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = P[i + 1][0] - P[i][0] || 1e-6; sl[i] = (P[i + 1][1] - P[i][1]) / dx[i]; }
  m[0] = sl[0]; m[n - 1] = sl[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = sl[i - 1] * sl[i] <= 0 ? 0 : (sl[i - 1] + sl[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (sl[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / sl[i], b = m[i + 1] / sl[i], h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * sl[i]; m[i + 1] = t * b * sl[i]; }
  }
  for (let i = 0; i < n - 1; i++) {
    const w = dx[i] / 3;
    d += `C${f(P[i][0] + w)},${f(P[i][1] + m[i] * w)} ${f(P[i + 1][0] - w)},${f(P[i + 1][1] - m[i + 1] * w)} ${f(P[i + 1][0])},${f(P[i + 1][1])}`;
  }
  return d;
}

function render() {
  if (!DATA) return;
  $('selHorizon').value = String(horizon);
  $('selStep').value = String(step);
  const W = seriesWindow();
  const allNames = Object.keys(W);
  const names = allNames.filter((n) => !hidden.has(n));
  $('legend').innerHTML = allNames.map((n) =>
    `<button class="chip${hidden.has(n) ? ' off' : ''}" data-n="${n}" style="--c:${colorOf(n)}" aria-pressed="${!hidden.has(n)}"><i></i><span>${n}</span></button>`).join('');
  const svg = $('chart');
  const values = names.flatMap((n) => W[n].flatMap((p) => [p.speed, p.gust])).filter((v) => v != null);
  if (!names.length || !values.length) { svg.innerHTML = ''; $('tbl').innerHTML = ''; $('readout').innerHTML = ''; VIEW = null; return; }

  // 1 SVG unit = 1 screen pixel, so text and lines keep their size on a phone
  const w = Math.max(300, Math.round(svg.getBoundingClientRect().width || 860));
  const narrow = w < 560;
  const fs = narrow ? 13 : 12, lw = narrow ? 3 : 2.5;
  const L = narrow ? 32 : 38, R = 10, T = 12, B = 32, h = narrow ? 320 : 340;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const t0 = Date.now() - 3600e3, t1 = Date.now() + horizon * 3600e3;
  const mx = Math.max(...values);
  const gridStep = unit === 'kn' ? (mx <= 30 ? 5 : 10) : (mx <= 14 ? 2 : 5);
  const vmax = Math.ceil(mx / gridStep) * gridStep + gridStep;
  const x = (t) => L + (t - t0) / (t1 - t0) * (w - L - R);
  const y = (v) => h - B - v / vmax * (h - T - B);

  let g = '';
  for (let v = 0; v <= vmax; v += gridStep) {
    g += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity="0.12"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="${fs}" fill="currentColor" opacity="0.75">${v}</text>`;
  }
  // time axis: label spacing follows horizon and width; day boundaries are stronger
  let every = horizon <= 48 ? 6 : horizon <= 96 ? 12 : 24;
  const minPx = narrow ? 62 : 70; // room for a label like "tors 29"
  while ((w - L - R) / (horizon / every) < (every >= 24 ? minPx : 34)) every *= 2;
  const firstHour = Math.ceil(t0 / 3600e3) * 3600e3;
  let dayIdx = 0;
  for (let t = firstHour; t <= t1; t += 3600e3) {
    const hr = localHour(t);
    if (hr === 0) dayIdx++;
    const show = every >= 24 ? (hr === 0 && (dayIdx - 1) % (every / 24) === 0) : hr % every === 0;
    if (!show) continue;
    g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${h - B}" stroke="currentColor" opacity="${hr === 0 ? 0.3 : 0.1}"/>`;
    const label = (hr === 0 || every >= 24) ? dayFmt.format(new Date(t)) : String(hr).padStart(2, '0');
    g += `<text x="${x(t)}" y="${h - 10}" text-anchor="middle" font-size="${fs}" fill="currentColor" opacity="0.75">${label}</text>`;
  }
  const nowT = Date.now();
  g += `<line x1="${x(nowT)}" x2="${x(nowT)}" y1="${T}" y2="${h - B}" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>`;

  // gust bands first (behind), then mean lines
  for (const n of names) {
    for (const seg of runs(W[n], (p) => p.speed != null && p.gust != null)) {
      const top = seg.map((p) => [x(p.t), y(Math.max(p.gust, p.speed))]);
      // lower edge: the lull where the source has one, otherwise the mean line
      const bot = seg.slice().reverse().map((p) => [x(p.t), y(p.lull != null ? Math.min(p.lull, p.speed) : p.speed)]);
      g += `<path d="${smoothPath(top)}${smoothPath(bot, true)}Z" fill="${colorOf(n)}" fill-opacity="0.16" stroke="none"/>`;
    }
  }
  for (const n of names) {
    for (const seg of runs(W[n], (p) => p.speed != null)) {
      const d = smoothPath(seg.map((p) => [x(p.t), y(p.speed)]));
      g += `<path d="${d}" fill="none" stroke="${colorOf(n)}" stroke-width="${lw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }
  svg.innerHTML = g + '<g id="hover" pointer-events="none"></g>';
  svg.style.color = getComputedStyle(document.body).color;
  VIEW = { w, h, L, R, T, B, t0, t1, x, y, W, names, lw };
  showAt(selT);

  renderTable(W, names);
}

// ---- hover / touch readout: values of every shown forecast at the nearest time ----
let VIEW = null, selT = null;
function nearest(pts, t, tol) {
  let best = null;
  for (const p of pts) if (p.speed != null && Math.abs(p.t - t) <= tol && (!best || Math.abs(p.t - t) < Math.abs(best.t - t))) best = p;
  return best;
}
function showAt(t) {
  if (!VIEW) return;
  const { x, y, T, h, B, W, names, lw, t0, t1 } = VIEW;
  if (t == null || t < t0 || t > t1) t = Math.round(Date.now() / 3600e3) * 3600e3;
  selT = t;
  let g = `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${h - B}" stroke="currentColor" stroke-width="1.5" opacity="0.65"/>`;
  let items = '';
  for (const n of names) {
    const p = nearest(W[n], t, 90 * 60e3);
    const c = colorOf(n);
    if (!p) { items += `<span class="it" style="--c:${c}"><i></i>${SHORT[n] || n} <small>–</small></span>`; continue; }
    g += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.speed).toFixed(1)}" r="${lw + 1.5}" fill="${c}" style="stroke:var(--card)" stroke-width="2"/>`;
    const arrow = p.dir == null ? '' : `<span class="arrow" style="transform:rotate(${p.dir + 180}deg)">↑</span> `;
    const range = p.gust == null ? '' : p.lull != null ? `${fmt(p.lull)}–${fmt(p.gust)}` : `gust ${fmt(p.gust)}`;
    items += `<span class="it" style="--c:${c}"><i></i>${SHORT[n] || n} <b>${arrow}${fmt(p.speed)}</b><small>${range}</small></span>`;
  }
  const isNow = Math.abs(t - Date.now()) < 30 * 60e3;
  $('hover').innerHTML = g;
  $('readout').innerHTML = `<div class="when">${hourFmt.format(new Date(t))} <span>${isNow ? '(now) ' : ''}· mean, lull–gust, ${unit === 'kn' ? 'kn' : 'm/s'}</span></div><div class="items">${items}</div>`;
}
function tFromEvent(e) {
  const r = $('chart').getBoundingClientRect();
  const px = (e.clientX - r.left) * (VIEW.w / r.width);
  const f = Math.min(1, Math.max(0, (px - VIEW.L) / (VIEW.w - VIEW.L - VIEW.R)));

}
for (const ev of ['pointermove', 'pointerdown']) $('chart').addEventListener(ev, (e) => { if (VIEW) showAt(tFromEvent(e)); });
$('chart').addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && VIEW) showAt(null); });

function renderTable(W, names) {
  const tol = step >= 3 ? 90 * 60e3 : 30 * 60e3; // 3-hourly models sit between hourly rows
  const unitLabel = unit === 'kn' ? 'kn' : 'm/s';
  let html = `<tr><th>${unitLabel}</th>` + names.map((n) => `<th style="color:${colorOf(n)}">${SHORT[n] || n}</th>`).join('') + '</tr>';
  const start = Math.ceil((Date.now() - 1800e3) / 3600e3) * 3600e3;
  for (let t = start; t <= Date.now() + horizon * 3600e3; t += step * 3600e3) {
    let cells = '', any = false;
    for (const n of names) {
      let best = null;
      for (const p of W[n]) if (p.speed != null && Math.abs(p.t - t) <= tol && (!best || Math.abs(p.t - t) < Math.abs(best.t - t))) best = p;
      if (!best) { cells += '<td><span class="none">–</span></td>'; continue; }
      any = true;
      const arrow = best.dir == null ? '' : `<span class="arrow" style="transform:rotate(${best.dir + 180}deg)">↑</span> `;
      const range = best.lull != null ? `${fmt(best.lull)}–${fmt(best.gust)}` : fmt(best.gust);
      cells += `<td><div class="v">${arrow}${fmt(best.speed)}</div><div class="r">${range}</div></td>`;
    }
    if (any) html += `<tr><td class="t"><b>${timeFmt.format(new Date(t))}</b><small>${dayFmt.format(new Date(t))}</small></td>${cells}</tr>`;

}

// ================= MAP VIEW =================
// A grid of points covering the visible map is fetched for one model, then interpolated
// to the screen: a coloured speed layer plus animated streamlines.
const MAP_MODELS = {
  dmi:    { id: 'dmi_harmonie_arome_europe', label: 'DMI HARMONIE 2 km', days: 3 },
  nordic: { id: 'metno_nordic',              label: 'MET Nordic 1 km',   days: 3 },
  ecmwf:  { id: 'ecmwf_ifs025',              label: 'ECMWF IFS 0.25°',   days: 7 },
};
const GRID_POINTS = 120, CELL = 10, VMAX = 28; // VMAX: m/s at the top of the colour scale
const STOPS = [[0, '#3a5fcd'], [3, '#2aa6d9'], [6, '#2fbf8f'], [9, '#9ad14b'], [12, '#f2d03b'], [15, '#f59a2e'], [18, '#ee5a36'], [22, '#d6336c'], [28, '#8e3bb8']];
const PALETTE = (() => {
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const out = [];
  for (let i = 0; i <= VMAX * 2; i++) {
    const s = i / 2; let k = 0;
    while (k < STOPS.length - 2 && s > STOPS[k + 1][0]) k++;
    const [s0, c0] = STOPS[k], [s1, c1] = STOPS[k + 1];
    const f = Math.min(1, Math.max(0, (s - s0) / (s1 - s0))), a = hex(c0), b = hex(c1);
    out.push(a.map((v, j) => Math.round(v + (b[j] - v) * f)));
  }
  return out;
})();
const palIdx = (s) => Math.min(VMAX * 2, Math.max(0, Math.round(s * 2)));
const PAL_CSS = PALETTE.map((c) => `rgb(${c[0]},${c[1]},${c[2]})`);

const MAP = { map: null, ready: false, model: recall('mapModel', 'dmi'), fitKey: '', loadedViewKey: '', reloadTimer: 0, base: recall('mapBase', 'dark'),
  data: null, grid: null, field: null, ti: 0, key: '', reqId: 0, parts: [], raf: 0, playing: null, layers: {}, rect: null, dot: null, pick: null, pickLL: null, size: [0, 0] };
if (!MAP_MODELS[MAP.model]) MAP.model = 'dmi';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- basemap: the dark CARTO style needs a key; without one the map falls back to OpenStreetMap ----
// The key lives in a separate config.js next to this page (kept out of git). A key pasted into
// the box overrides it in this browser only.
const CARTO_KEY_BUILTIN = String((window.WIND_CONFIG && window.WIND_CONFIG.cartoKey) || '');
let CARTO_KEY = String(recall('cartoKey', '') || CARTO_KEY_BUILTIN);
const activeBase = () => (MAP.base === 'dark' && CARTO_KEY ? 'dark' : 'light');
function makeDarkLayer() {
  return L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(CARTO_KEY)}`,
    { maxZoom: 14, attribution: '© OpenStreetMap contributors © CARTO' });
}
function updateKeyUi() {
  const custom = CARTO_KEY && CARTO_KEY !== CARTO_KEY_BUILTIN;
  $('keySummary').textContent = `Dark map key: ${custom ? 'custom, saved in this browser' : CARTO_KEY ? 'from config.js' : 'not set'}`;
  $('keyMsg').textContent = custom
    ? 'This key overrides config.js in this browser only. Clear returns to the key in config.js.'
    : CARTO_KEY ? 'Using the key from config.js. Paste another key here to override it in this browser.'
    : 'No key found. Put it in config.js next to this page, or paste it here to save it in this browser. Without a key the map uses the light OpenStreetMap style.';
}
function applyBase() {
  if (!MAP.ready) return;
  if (MAP.current) MAP.map.removeLayer(MAP.current);
  if (activeBase() === 'dark') {
    MAP.layers.dark = makeDarkLayer();
    MAP.layers.dark.once('tileerror', () => { $('keyMsg').textContent = 'The dark tiles did not load. Check the key and your connection.'; });
    MAP.current = MAP.layers.dark;
  } else MAP.current = MAP.layers.light;
  MAP.current.addTo(MAP.map); MAP.current.bringToBack();
  rebuildField();
}

function initMap() {
  if (MAP.ready) return true;
  if (typeof L === 'undefined') { $('mapStatus').textContent = 'The map library could not be loaded. Check your internet connection.'; return false; }
  const m = L.map('map', { preferCanvas: true, zoomSnap: 0.25 }).setView([LAT, LON], 9);
  MAP.layers = { light: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 14, attribution: '© OpenStreetMap contributors' }) };
  m.attributionControl.addAttribution('Wind: Open-Meteo, DMI, MET Norway, ECMWF');
  m.on('movestart zoomstart', () => { $('heat').style.opacity = 0; $('parts').style.opacity = 0; });
  m.on('moveend zoomend resize', () => { sizeCanvases(); rebuildField(); $('heat').style.opacity = 1; $('parts').style.opacity = 1; });
  m.on('moveend', scheduleReload);
  m.on('click', onMapClick);
  MAP.map = m; MAP.ready = true;
  applyBase();
  drawMarkers();
  return true;
}

function gridSpec(clat, clon, km) {
  const dLat = km / 2 / 110.574, dLon = km / 2 / (111.32 * Math.cos(clat * Math.PI / 180));
  return { lat0: clat - dLat, lat1: clat + dLat, lon0: clon - dLon, lon1: clon + dLon };
}

// The wind grid follows the map: it covers the visible area plus a margin, about GRID_POINTS points
// laid out to match the screen shape, and is fetched again after you stop panning or zooming.
function gridForView() {
  const b = MAP.map.getBounds().pad(0.25);
  const lat0 = Math.max(-85, b.getSouth()), lat1 = Math.min(85, b.getNorth());
  const lon0 = Math.max(-180, b.getWest()), lon1 = Math.min(180, b.getEast());
  const hKm = (lat1 - lat0) * 110.574, wKm = (lon1 - lon0) * 111.32 * Math.cos((lat0 + lat1) / 2 * Math.PI / 180);
  const aspect = Math.max(0.2, Math.min(5, wKm / hKm)); // width / height of the area
  const ny = Math.max(4, Math.min(24, Math.round(Math.sqrt(GRID_POINTS / aspect))));
  const nx = Math.max(4, Math.min(24, Math.round(GRID_POINTS / ny)));
  return { lat0, lat1, lon0, lon1, nx, ny, spacingKm: (wKm / (nx - 1) + hKm / (ny - 1)) / 2 };
}
const viewKey = () => { const v = MAP.map.getBounds(); return [v.getSouth(), v.getNorth(), v.getWest(), v.getEast()].map((x) => x.toFixed(3)).join('|'); };
function viewNeedsReload() {
  if (!MAP.data) return true;
  const v = MAP.map.getBounds(), g = MAP.data.g;
  const inside = v.getSouth() >= g.lat0 && v.getNorth() <= g.lat1 && v.getWest() >= g.lon0 && v.getEast() <= g.lon1;
  const ratio = (v.getNorth() - v.getSouth()) / (g.lat1 - g.lat0);

}

  clearTimeout(MAP.reloadTimer);
  MAP.reloadTimer = setTimeout(() => {
    if ($('viewMap').hidden || !MAP.ready || viewKey() === MAP.loadedViewKey) return;
    if (viewNeedsReload()) loadMapData();
  }, 600);
}

async function loadMapData() {
  const my = ++MAP.reqId;
  const cfg = MAP_MODELS[MAP.model];
  const g = gridForView();
  MAP.loadedViewKey = viewKey();
  $('mapStatus').textContent = 'Updating wind field…';
  const lats = [], lons = [];
  for (let iy = 0; iy < g.ny; iy++) for (let ix = 0; ix < g.nx; ix++) {
    lats.push((g.lat0 + (g.lat1 - g.lat0) * iy / (g.ny - 1)).toFixed(3));
    lons.push((g.lon0 + (g.lon1 - g.lon0) * ix / (g.nx - 1)).toFixed(3));
  }
  try {
    const j = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lons.join(',')}` +
      `&hourly=wind_speed_10m,wind_direction_10m&models=${cfg.id}&wind_speed_unit=ms&timezone=UTC&forecast_days=${cfg.days}`);
    if (my !== MAP.reqId) return; // a newer request replaced this one
    const arr = Array.isArray(j) ? j : [j];
    if (arr.length !== g.nx * g.ny) throw new Error('unexpected response');
    const pick = (h, name) => h[`${name}_${cfg.id}`] || h[name] || [];
    const times = arr[0].hourly.time.map((t) => new Date(t + 'Z').getTime());
    const sp = arr.map((a) => pick(a.hourly, 'wind_speed_10m')), dr = arr.map((a) => pick(a.hourly, 'wind_direction_10m'));
    const ok = times.map((_, i) => sp.filter((s) => s[i] != null).length > sp.length / 4);
    const now = Date.now();
    const first = times.findIndex((t, i) => ok[i] && t >= now - 3600e3), last = ok.lastIndexOf(true);
    if (first < 0 || last < first) throw new Error('this model has no data here');
    MAP.data = { times, sp, dr, g, first, last, label: cfg.label };
    if (MAP.ti < first || MAP.ti > last) MAP.ti = first;
    const sl = $('mapTime'); sl.min = first; sl.max = last; sl.value = MAP.ti;
    $('mapStatus').textContent = '';
    $('mapNote').textContent = `${cfg.label}. Wind is sampled about every ${g.spacingKm < 10 ? g.spacingKm.toFixed(1) : Math.round(g.spacingKm)} km across the map and smoothed between points. The grid follows the map when you pan or zoom.`;
    drawMarkers();
    sizeCanvases();
    renderTicks(); renderMapGraph();
    setTime(MAP.ti);
  } catch (e) {
    if (my === MAP.reqId) { $('mapStatus').innerHTML = `Could not update the wind field (${e.message}). <button id="useMock2">Use mock data</button>`; $('useMock2').onclick = useMock; }
  }
}

// frame roughly 8 km each way around the forecast location (only when that location has changed, unless forced)
function ensureFramed(force) {
  const fk = `${LAT}|${LON}`;
  if (!force && MAP.fitKey === fk) return;
  MAP.fitKey = fk;
  const g = gridSpec(LAT, LON, 16);
  MAP.map.invalidateSize();
  MAP.map.fitBounds([[g.lat0, g.lon0], [g.lat1, g.lon1]], { padding: [6, 6], animate: false });
}
function drawMarkers() {
  if (MAP.dot) MAP.dot.setLatLng([LAT, LON]);
  else MAP.dot = L.circleMarker([LAT, LON], { radius: 6, color: '#ffffff', weight: 2, fillColor: '#e8590c', fillOpacity: 1, interactive: false }).addTo(MAP.map);
}

function setTime(ti) {
  const d = MAP.data; if (!d) return;
  MAP.ti = ti;
  const n = d.g.nx * d.g.ny, gs = new Float32Array(n), gu = new Float32Array(n), gv = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    const s = d.sp[k][ti], dir = d.dr[k][ti];
    if (s == null || dir == null) { gs[k] = gu[k] = gv[k] = NaN; continue; }
    const r = dir * Math.PI / 180;
    gs[k] = s; gu[k] = -s * Math.sin(r); gv[k] = -s * Math.cos(r); // direction is where the wind comes from
  }
  MAP.grid = { gs, gu, gv };
  $('mapWhen').textContent = `${hourFmt.format(new Date(d.times[ti]))}${Math.abs(d.times[ti] - Date.now()) < 30 * 60e3 ? ' (now)' : ''} · ${d.label}`;
  renderLegend();
  moveCursor();
  rebuildField();
}

// bilinear sample of the model grid at a lat/lon; returns [u, v, speed] in m/s or null outside the grid
function sampleGrid(lat, lon) {
  const g = MAP.data.g, gr = MAP.grid, nx = g.nx, ny = g.ny;
  const fx = (lon - g.lon0) / (g.lon1 - g.lon0) * (nx - 1), fy = (lat - g.lat0) / (g.lat1 - g.lat0) * (ny - 1);
  if (fx < 0 || fy < 0 || fx > nx - 1 || fy > ny - 1) return null;
  const x0 = Math.min(nx - 2, Math.floor(fx)), y0 = Math.min(ny - 2, Math.floor(fy)), tx = fx - x0, ty = fy - y0;
  const idx = [y0 * nx + x0, y0 * nx + x0 + 1, (y0 + 1) * nx + x0, (y0 + 1) * nx + x0 + 1];
  const w = [(1 - tx) * (1 - ty), tx * (1 - ty), (1 - tx) * ty, tx * ty];
  let S = 0, U = 0, V = 0, W = 0;
  for (let i = 0; i < 4; i++) {
    const s = gr.gs[idx[i]]; if (Number.isNaN(s)) continue;
    S += s * w[i]; U += gr.gu[idx[i]] * w[i]; V += gr.gv[idx[i]] * w[i]; W += w[i];
  }
  if (W < 0.5) return null;
  S /= W; U /= W; V /= W;
  const m = Math.hypot(U, V);
  if (m > 1e-6) { U = U / m * S; V = V / m * S; } // keep the interpolated speed when directions partly cancel
  return [U, V, S];
}

function sizeCanvases() {
  const wrap = $('mapwrap'), w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (const id of ['heat', 'parts']) {
    const c = $(id); c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  MAP.size = [w, h];
  const want = REDUCED ? 0 : Math.min(1600, Math.max(500, Math.round(w * h / 300)));
  if (MAP.parts.length !== want) MAP.parts = Array.from({ length: want }, () => ({ x: 0, y: 0, age: 1e9, life: 0 }));
}

// screen-space field: one wind vector every CELL pixels
function rebuildField() {
  if (!MAP.ready || !MAP.data || !MAP.grid) return;
  const [w, h] = MAP.size; if (!w || !h) return;
  const cols = Math.ceil(w / CELL) + 1, rows = Math.ceil(h / CELL) + 1;
  const U = new Float32Array(cols * rows), V = new Float32Array(cols * rows), S = new Float32Array(cols * rows);
  const img = new ImageData(cols, rows), alpha = activeBase() === 'light' ? 110 : 78;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const ll = MAP.map.containerPointToLatLng([c * CELL, r * CELL]);
    const s = sampleGrid(ll.lat, ll.lng), i = r * cols + c;
    if (!s) { U[i] = V[i] = S[i] = NaN; continue; }
    U[i] = s[0]; V[i] = s[1]; S[i] = s[2];
    const col = PALETTE[palIdx(s[2])];
    img.data[i * 4] = col[0]; img.data[i * 4 + 1] = col[1]; img.data[i * 4 + 2] = col[2]; img.data[i * 4 + 3] = alpha;
  }
  MAP.field = { cols, rows, U, V, S };
  const off = document.createElement('canvas'); off.width = cols; off.height = rows;
  off.getContext('2d').putImageData(img, 0, 0);
  const hc = $('heat').getContext('2d');
  hc.clearRect(0, 0, w, h);
  hc.imageSmoothingEnabled = true; hc.imageSmoothingQuality = 'high';
  hc.drawImage(off, -CELL / 2, -CELL / 2, cols * CELL, rows * CELL);
  $('parts').getContext('2d').clearRect(0, 0, w, h);
}

const _v = [0, 0, 0];
function sampleScreen(x, y) {
  const f = MAP.field; if (!f) return null;
  const fx = x / CELL, fy = y / CELL, c0 = Math.floor(fx), r0 = Math.floor(fy);
  if (c0 < 0 || r0 < 0 || c0 >= f.cols - 1 || r0 >= f.rows - 1) return null;
  const tx = fx - c0, ty = fy - r0, i00 = r0 * f.cols + c0, i10 = i00 + 1, i01 = i00 + f.cols, i11 = i01 + 1;
  if (Number.isNaN(f.S[i00]) || Number.isNaN(f.S[i10]) || Number.isNaN(f.S[i01]) || Number.isNaN(f.S[i11])) return null;
  const a = (1 - tx) * (1 - ty), b = tx * (1 - ty), c = (1 - tx) * ty, d = tx * ty;
  _v[0] = f.U[i00] * a + f.U[i10] * b + f.U[i01] * c + f.U[i11] * d;
  _v[1] = f.V[i00] * a + f.V[i10] * b + f.V[i01] * c + f.V[i11] * d;
  _v[2] = f.S[i00] * a + f.S[i10] * b + f.S[i01] * c + f.S[i11] * d;
  return _v;
}

function respawn(p) {
  const [w, h] = MAP.size;
  for (let k = 0; k < 6; k++) {
    p.x = Math.random() * w; p.y = Math.random() * h;
    if (sampleScreen(p.x, p.y)) { p.age = 0; p.life = 40 + Math.random() * 80; return; }
  }
  p.age = p.life = 1e9; // nothing here: try again next frame
}

function frame() {
  MAP.raf = requestAnimationFrame(frame);
  if (!MAP.field || document.hidden || !MAP.parts.length) return;
  const [w, h] = MAP.size, ctx = $('parts').getContext('2d');
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.09)'; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = activeBase() === 'light' ? 0.88 : 0.62; // fainter on the dark map, stronger on the light one
  ctx.lineWidth = 1.7; ctx.lineCap = 'round';
  const K = 0.22; // pixels per frame for each m/s of wind
  for (const p of MAP.parts) {
    if (p.age++ > p.life) { respawn(p); continue; }
    const s = sampleScreen(p.x, p.y);
    if (!s) { respawn(p); continue; }
    const nx = p.x + s[0] * K, ny = p.y - s[1] * K;
    ctx.strokeStyle = PAL_CSS[palIdx(s[2])];
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
    p.x = nx; p.y = ny;
  }
}
function startAnim() { if (!MAP.raf && !REDUCED) MAP.raf = requestAnimationFrame(frame); }
function stopAnim() { cancelAnimationFrame(MAP.raf); MAP.raf = 0; stopPlay(); }

function renderLegend() {
  const bar = $('mapLegend');
  const stops = STOPS.map(([s, c]) => `${c} ${(s / VMAX * 100).toFixed(1)}%`).join(', ');
  bar.style.background = `linear-gradient(to right, ${stops})`;
  const ticks = unit === 'kn' ? [0, 10, 20, 30, 40, 50] : [0, 5, 10, 15, 20, 25];
  bar.innerHTML = ticks.map((v) => `<span style="left:${(Math.min(VMAX, unit === 'kn' ? v / 1.94384 : v) / VMAX * 100).toFixed(1)}%">${v}</span>`).join('') +
    `<span style="left:100%;transform:translateX(-100%);top:-18px">${unit === 'kn' ? 'kn' : 'm/s'}</span>`;
}
function mapUnits() { if (MAP.ready) { renderLegend(); renderMapGraph(); $('mapReadout').textContent = 'Tap anywhere on the map to read the wind there, or to get the forecast for that spot.'; } }

// Tapping anywhere selects that point. "Forecast here" works even where there is no wind data on the map.
function onMapClick(e) {
  const ll = e.latlng.wrap();
  if (MAP.pick) MAP.pick.remove();
  MAP.pickLL = ll;
  renderMapGraph();
  MAP.pick = L.circleMarker(ll, { radius: 6, color: '#ffffff', weight: 2, fillColor: '#000000', fillOpacity: 0.6, interactive: false }).addTo(MAP.map);
  const lat = +ll.lat.toFixed(4), lon = +ll.lng.toFixed(4);
  const s = MAP.data && MAP.grid ? sampleGrid(ll.lat, ll.lng) : null;
  let wind = `No wind data here · ${lat}, ${lon}`;
  if (s) {
    const from = (Math.atan2(-s[0], -s[1]) * 180 / Math.PI + 360) % 360;
    wind = `<b>${fmt(conv(s[2]))} ${unit === 'kn' ? 'kn' : 'm/s'}</b> from ${Math.round(from)}° · ${lat}, ${lon}`;
  }
  $('mapReadout').innerHTML = `${wind}<button id="mapHere">Forecast here</button>`;
  $('mapHere').onclick = () => {
    if (MAP.pick) { MAP.pick.remove(); MAP.pick = null; } MAP.pickLL = null; // the orange forecast dot takes over this spot
    setLocation(lat, lon, 'Map point');
    switchTab('forecast');
  };
}


// ---- time-slider ticks and compact wind graph ----
const GR = { w: 0, h: 76, L: 10, R: 10, T: 16, B: 4, t0: 0, t1: 1, vmax: 1, ser: null };
const graphPoint = () => (MAP.pickLL ? [MAP.pickLL.lat, MAP.pickLL.lng] : [LAT, LON]);
const dayOnly = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short', day: 'numeric' });
const hr2 = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour: '2-digit', hour12: false });

function renderTicks() {
  const d = MAP.data, box = $('mapTicks'); if (!d) { box.innerHTML = ''; return; }
  const w = $('mapTime').clientWidth - 20; if (w < 50) return;
  const ta = d.times[d.first], tb = d.times[d.last], span = Math.max(1, tb - ta);
  const xp = (t) => 10 + (t - ta) / span * w - 10; // box has 10 px margins; thumb centre travels the same range
  const pxPerH = w / (span / 3600e3);
  const step = [3, 6, 12, 24, 48].find((s) => s * pxPerH >= 34) || 48;
  let html = '';
  const start = Math.ceil(ta / 3600e3) * 3600e3;
  for (let t = start; t <= tb; t += 3600e3) {
    const hh = parseInt(hr2.format(new Date(t)), 10) % 24;
    const pos = (t - ta) / span * w + 0; 
    if (hh === 0) {
      const dayIdx = Math.round(t / 86400e3);
      const label = step >= 48 && dayIdx % 2 ? '' : dayOnly.format(new Date(t));
      html += `<i class="day" style="left:${pos.toFixed(1)}px"></i>` + (label ? `<span class="day" style="left:${pos.toFixed(1)}px">${label}</span>` : '');
    } else if (hh % step === 0 && step < 24) {
      html += `<i style="left:${pos.toFixed(1)}px"></i><span style="left:${pos.toFixed(1)}px">${String(hh).padStart(2, '0')}</span>`;
    }
  }
  box.style.marginLeft = '10px'; box.style.marginRight = '10px';
  box.innerHTML = html;
}

// graph data: model wind speed at the chosen point across the whole forecast, taken from the map grid
function graphSeries() {
  const d = MAP.data; if (!d) return null;
  const [lat, lon] = graphPoint(), g = d.g, nx = g.nx, ny = g.ny;
  const fx = Math.min(nx - 1, Math.max(0, (lon - g.lon0) / (g.lon1 - g.lon0) * (nx - 1)));
  const fy = Math.min(ny - 1, Math.max(0, (lat - g.lat0) / (g.lat1 - g.lat0) * (ny - 1)));
  const x0 = Math.min(nx - 2, Math.floor(fx)), y0 = Math.min(ny - 2, Math.floor(fy)), tx = fx - x0, ty = fy - y0;
  const idx = [y0 * nx + x0, y0 * nx + x0 + 1, (y0 + 1) * nx + x0, (y0 + 1) * nx + x0 + 1];
  const wt = [(1 - tx) * (1 - ty), tx * (1 - ty), (1 - tx) * ty, tx * ty];
  const pts = [];
  for (let i = d.first; i <= d.last; i++) {
    let S = 0, W = 0;
    for (let k = 0; k < 4; k++) { const v = d.sp[idx[k]][i]; if (v != null) { S += v * wt[k]; W += wt[k]; } }
    pts.push({ t: d.times[i], i, v: W > 0.3 ? S / W : null });
  }
  return pts;
}

function renderMapGraph() {
  const svg = $('mapGraph'), d = MAP.data;
  if (!d) { svg.innerHTML = ''; return; }
  const ser = graphSeries(); GR.ser = ser;
  const w = Math.max(200, Math.round(svg.getBoundingClientRect().width || 300)), h = GR.h;
  GR.w = w; svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const vals = ser.map((p) => p.v).filter((v) => v != null);
  if (!vals.length) { svg.innerHTML = ''; return; }
  GR.t0 = ser[0].t; GR.t1 = ser[ser.length - 1].t;
  const vmaxMs = Math.max(...vals) * 1.1 + 0.5;
  const unitStep = unit === 'kn' ? 5 : 2;
  const vmaxU = Math.max(unitStep, Math.ceil(conv(vmaxMs) / unitStep) * unitStep), vmax = unit === 'kn' ? vmaxU / 1.94384 : vmaxU;
  GR.vmax = vmax;
  const { L, R, T, B } = GR, iw = w - L - R, ih = h - T - B;
  const x = (t) => L + (t - GR.t0) / Math.max(1, GR.t1 - GR.t0) * iw;
  const y = (v) => T + ih - Math.min(1, v / vmax) * ih;
  // vertical gradient: colour follows wind speed, so the line turns warm where the wind is strong
  const stops = STOPS.slice().reverse().map(([v, c]) => {
    const off = 1 - Math.min(1, v / vmax); return off >= 0 && v <= vmax * 1.0001 ? `<stop offset="${(off * 100).toFixed(1)}%" stop-color="${c}"/>` : '';
  }).join('');
  let topCol = STOPS[STOPS.length - 1][1];
  for (let k = 0; k < STOPS.length - 1; k++) if (vmaxMs >= 0 && vmax >= STOPS[k][0] && vmax <= STOPS[k + 1][0]) {
    const f = (vmax - STOPS[k][0]) / (STOPS[k + 1][0] - STOPS[k][0]);
    const a = STOPS[k][1], b = STOPS[k + 1][1], ch = (i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - f) + parseInt(b.slice(i, i + 2), 16) * f).toString(16).padStart(2, '0');
    topCol = `#${ch(1)}${ch(3)}${ch(5)}`;
  }
  const grad = `<linearGradient id="gSpd" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${T + ih}"><stop offset="0%" stop-color="${topCol}"/>${stops}</linearGradient>`;
  const gradFill = grad.replace('gSpd', 'gSpdF');
  let g = `<defs>${grad}${gradFill}</defs>`;
  g += `<line x1="${L}" x2="${w - R}" y1="${T + ih}" y2="${T + ih}" stroke="currentColor" opacity="0.18"/>`;
  g += `<line x1="${L}" x2="${w - R}" y1="${T}" y2="${T}" stroke="currentColor" opacity="0.1" stroke-dasharray="2 3"/>`;
  g += `<text x="${L}" y="${T - 4}" font-size="11" fill="currentColor" opacity="0.65">${vmaxU} ${unit === 'kn' ? 'kn' : 'm/s'}</text>`;
  for (const run of runs(ser, (p) => p.v != null)) {
    const line = smoothPath(run.map((p) => [x(p.t), y(p.v)]));
    g += `<path d="${line}L${x(run[run.length - 1].t).toFixed(1)},${T + ih}L${x(run[0].t).toFixed(1)},${T + ih}Z" fill="url(#gSpdF)" opacity="0.16"/>`;
    g += `<path d="${line}" fill="none" stroke="url(#gSpd)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<line id="gCur" y1="${T}" y2="${T + ih}" stroke="currentColor" opacity="0.7" stroke-width="1.5"/><circle id="gDot" r="4.5" stroke="#fff" stroke-width="1.5"/>`;
  svg.innerHTML = g;
  svg.style.color = getComputedStyle(document.body).color;
  moveCursor();
}

function moveCursor() {
  const cur = $('gCur'), dot = $('gDot'), d = MAP.data; if (!cur || !dot || !d || !GR.ser) return;
  const p = GR.ser.find((q) => q.i === MAP.ti) || null; if (!p) return;
  const iw = GR.w - GR.L - GR.R, ih = GR.h - GR.T - GR.B;
  const x = GR.L + (p.t - GR.t0) / Math.max(1, GR.t1 - GR.t0) * iw;
  cur.setAttribute('x1', x); cur.setAttribute('x2', x);
  if (p.v == null) { dot.setAttribute('r', 0); $('mapGraphCap').textContent = ''; return; }
  dot.setAttribute('r', 4.5); dot.setAttribute('cx', x);
  dot.setAttribute('cy', GR.T + ih - Math.min(1, p.v / GR.vmax) * ih);
  dot.setAttribute('fill', PAL_CSS[palIdx(p.v)]);
  $('mapGraphCap').textContent = `${MAP.pickLL ? 'Selected spot' : 'Your forecast spot'} · ${fmt(conv(p.v))} ${unit === 'kn' ? 'kn' : 'm/s'} · ${d.label}`;
}

function scrubGraph(ev) {
  const d = MAP.data; if (!d || !GR.ser) return;
  const r = $('mapGraph').getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (ev.clientX - r.left - GR.L) / Math.max(1, r.width - GR.L - GR.R)));
  const t = GR.t0 + f * (GR.t1 - GR.t0);
  let best = d.first, bd = Infinity;
  for (let i = d.first; i <= d.last; i++) { const dd = Math.abs(d.times[i] - t); if (dd < bd) { bd = dd; best = i; } }
  $('mapTime').value = best; setTime(best);
}
(() => {
  const el = $('mapGraph'); let down = false;
  el.addEventListener('pointerdown', (e) => { down = true; stopPlay(); try { el.setPointerCapture(e.pointerId); } catch (_) {} scrubGraph(e); });
  el.addEventListener('pointermove', (e) => { if (down) scrubGraph(e); });
  const up = () => { down = false; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
})();

function startPlay() {
  if (MAP.playing || !MAP.data) return;
  $('mapPlay').textContent = '⏸';
  MAP.playing = setInterval(() => {
    const d = MAP.data; if (!d) return;
    let ti = MAP.ti + 1; if (ti > d.last) ti = d.first;
    $('mapTime').value = ti; setTime(ti);
  }, 450);
}
function stopPlay() { if (MAP.playing) { clearInterval(MAP.playing); MAP.playing = null; } $('mapPlay').textContent = '▶'; }

$('mapPlay').onclick = () => (MAP.playing ? stopPlay() : startPlay());
$('mapTime').oninput = (e) => setTime(+e.target.value);
$('mapModel').value = MAP.model;
$('mapBase').value = MAP.base === 'light' ? 'light' : 'dark';
$('mapModel').onchange = (e) => { MAP.model = e.target.value; store('mapModel', MAP.model); if (MAP.ready) loadMapData(); };
$('mapZoomIn').onclick = () => { if (!MAP.ready) return; if (MAP.pick) { MAP.pick.remove(); MAP.pick = null; } MAP.pickLL = null; ensureFramed(true); renderMapGraph(); };
$('mapBase').onchange = (e) => {
  MAP.base = e.target.value; store('mapBase', MAP.base);
  if (MAP.base === 'dark' && !CARTO_KEY) { $('keyBox').open = true; }
  applyBase();
};
function saveKey() {
  const k = $('keyInput').value.trim();
  if (!k) { $('keyMsg').textContent = 'Paste the key first.'; return; }
  CARTO_KEY = k; store('cartoKey', k);
  MAP.base = 'dark'; store('mapBase', 'dark'); $('mapBase').value = 'dark';
  updateKeyUi(); applyBase();
}
$('keySave').onclick = saveKey;
$('keyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveKey(); });
$('keyClear').onclick = () => { CARTO_KEY = CARTO_KEY_BUILTIN; store('cartoKey', ''); $('keyInput').value = ''; updateKeyUi(); applyBase(); };
$('keyInput').value = CARTO_KEY === CARTO_KEY_BUILTIN ? '' : CARTO_KEY;
updateKeyUi();

// ---- tabs ----
function switchTab(t) {
  store('tab', t);
  $('viewForecast').hidden = t !== 'forecast';
  $('viewMap').hidden = t !== 'map';
  $('tabF').classList.toggle('on', t === 'forecast');
  $('tabM').classList.toggle('on', t === 'map');
  if (t === 'map') {
    if (!initMap()) return;
    MAP.map.invalidateSize(); sizeCanvases();
    ensureFramed(false); // re-centres only if the forecast location changed since the map was last open
    drawMarkers();
    if (viewKey() !== MAP.loadedViewKey || !MAP.data) loadMapData(); else { renderTicks(); renderMapGraph(); }
    startAnim();
  } else {
    stopAnim();
    render();
  }
}
$('tabF').onclick = () => switchTab('forecast');
$('tabM').onclick = () => switchTab('map');
switchTab(recall('tab', 'forecast') === 'map' ? 'map' : 'forecast');

load();
setInterval(load, 15 * 60 * 1000);
// redraw when the phone rotates or the window resizes, so the chart keeps pixel-sized text
let lastW = 0, resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { const w = $('chart').getBoundingClientRect().width; if (Math.abs(w - lastW) > 1) { lastW = w; render(); } if (MAP.ready && !$('viewMap').hidden) { renderTicks(); renderMapGraph(); } }, 150);
});
</script>
